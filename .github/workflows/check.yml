name: Public client checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate n8n export guards
        run: node examples/n8n/verify-workflow.mjs
      - run: npm run build
      - name: Match the published npm release
        run: |
          npm pack databazaar-agent-tools@0.1.1 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          python3 scripts/verify-published.py "$RUNNER_TEMP/databazaar-agent-tools-0.1.1.tgz"
